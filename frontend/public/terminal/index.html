<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ResQFly Console — Autonomous Drone Ground Control Station" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <title>ResQFly Console</title>
  <script type="module" crossorigin src="./assets/index-Ux_77K_7.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CchqMJ_-.css">
</head>
<body>
  <div id="app">
    <!-- Login Overlay -->
    <div id="login-overlay" class="hidden">
      <canvas id="login-canvas"></canvas>
      <div id="login-form">
        <div id="login-header">T.E.C.H. AUTHENTICATION</div>
        <input id="login-user" type="text" placeholder="IDENTITY" autocomplete="off" />
        <input id="login-pass" type="password" placeholder="PASSPHRASE" />
        <div id="login-msg"></div>
        <button id="login-btn">INITIALIZE LINK</button>
      </div>
    </div>

    <!-- Main Canvas (cyberpunk border, hex bg, intro animations) -->
    <canvas id="main-canvas"></canvas>

    <!-- Content Container (fades in after login) -->
    <div id="content" class="hidden">
      <!-- Header -->
      <div id="header">
        <span id="status-lbl">SYSTEM READY</span>
        <span id="app-title">TERMINAL</span>
        <div id="win-controls">
          <button id="btn-fullscreen" class="win-btn" title="Toggle Fullscreen (F11)">⛶</button>
          <button id="btn-settings" class="win-btn" title="Settings">☼</button>
        </div>
      </div>

      <!-- Tab Bar -->
      <div id="tab-bar">
        <button class="tab active" data-tab="terminal">TERMINAL</button>
        <button class="tab" data-tab="bio">BIO</button>
        <button class="tab" data-tab="status">STATUS</button>
        <button class="tab" data-tab="prec">PRE-C</button>
        <button class="tab" data-tab="map">MAP</button>
        <button class="tab" data-tab="optics">OPTICS</button>
        <button class="tab" data-tab="remote">REMOTE</button>
        <button class="tab" data-tab="settings">SETTINGS</button>
      </div>

      <!-- Tab Content Panels -->
      <div id="tab-content">
        <!-- TERMINAL -->
        <div class="tab-panel active" id="panel-terminal">
          <!-- Real-Time Subsystem Telemetry Strip -->
          <div id="terminal-telemetry-bar">
            <div class="telem-chip" id="tb-link"><span class="chip-dot green"></span> LINK: <span class="val">Pixhawk MAVLink (COM17)</span></div>
            <div class="telem-chip" id="tb-gnss"><span class="chip-dot green"></span> GNSS: <span class="val">3D FIX (18 SATS)</span></div>
            <div class="telem-chip" id="tb-batt"><span class="chip-dot green"></span> BATT: <span class="val">22.2V (94%)</span></div>
            <div class="telem-chip" id="tb-mode"><span class="chip-dot green"></span> MODE: <span class="val">STABILIZE</span></div>
            <div class="telem-chip" id="tb-alt"><span class="chip-dot green"></span> ALT: <span class="val">0.0m AGL</span></div>
            <div class="telem-chip" id="tb-spd"><span class="chip-dot green"></span> SPD: <span class="val">0.0 km/h</span></div>
          </div>
          <div id="terminal-output"></div>
          <div id="terminal-input-row">
            <span id="prompt-label">&gt;</span>
            <input id="terminal-input" type="text" placeholder="Enter command (type 'help' for manual)..." autocomplete="off" spellcheck="false" />
          </div>
        </div>

        <!-- BIO -->
        <div class="tab-panel" id="panel-bio">
          <canvas id="bio-canvas"></canvas>
        </div>

        <!-- STATUS -->
        <div class="tab-panel" id="panel-status">
          <canvas id="status-canvas"></canvas>
        </div>

        <!-- PRE-CHECK -->
        <div class="tab-panel" id="panel-prec">
          <canvas id="prec-canvas"></canvas>
        </div>

        <!-- SAR MAP -->
        <div class="tab-panel" id="panel-map">
          <canvas id="map-canvas"></canvas>
        </div>

        <!-- OPTICS (FLIR RADIOMETRIC) -->
        <div class="tab-panel" id="panel-optics">
          <canvas id="optics-canvas"></canvas>
        </div>

        <!-- REMOTE / DRONE FLIGHT DECK -->
        <div class="tab-panel" id="panel-remote">
          <canvas id="remote-canvas"></canvas>
        </div>

        <!-- SETTINGS -->
        <div class="tab-panel" id="panel-settings">
          <div id="settings-container">
            <div class="settings-card">
              <div class="settings-section-title">AUDIO &amp; SYNTHESIS</div>
              <div class="setting-row">
                <label for="set-volume">Master Volume</label>
                <div class="setting-ctrl">
                  <input id="set-volume" type="range" min="0" max="100" value="70" />
                  <span class="setting-val" id="val-volume">70%</span>
                </div>
              </div>
              <div class="setting-row">
                <label for="set-sfx">Interface SFX</label>
                <input id="set-sfx" type="checkbox" checked />
              </div>
            </div>

            <div class="settings-card">
              <div class="settings-section-title">TACTICAL DISPLAY</div>
              <div class="setting-row">
                <label for="set-glitch">Scanline &amp; CRT Glitch FX</label>
                <input id="set-glitch" type="checkbox" checked />
              </div>
              <div class="setting-row">
                <label for="set-particles">Particle Density</label>
                <div class="setting-ctrl">
                  <input id="set-particles" type="range" min="50" max="500" value="200" />
                  <span class="setting-val" id="val-particles">200</span>
                </div>
              </div>
              <div class="setting-row">
                <label for="set-hud">HUD Color Theme</label>
                <select id="set-hud">
                  <option value="crimson" selected>Crimson Cyberpunk</option>
                  <option value="emerald">Tactical Emerald</option>
                  <option value="amber">Amber Warning</option>
                  <option value="cyan">Neon Cyan</option>
                </select>
              </div>
            </div>

            <div class="settings-card">
              <div class="settings-section-title">COMMUNICATION &amp; MESH</div>
              <div class="setting-row">
                <label for="set-freq">Radio Frequency Band</label>
                <select id="set-freq">
                  <option value="915" selected>915 MHz Long-Range (RFD900X)</option>
                  <option value="2.4">2.4 GHz Multi-Node Mesh</option>
                  <option value="5.8">5.8 GHz High-Bandwidth Video</option>
                </select>
              </div>
              <div class="setting-row">
                <label for="set-poll">MAVLink Telemetry Rate</label>
                <div class="setting-ctrl">
                  <input id="set-poll" type="range" min="1" max="50" value="10" />
                  <span class="setting-val" id="val-poll">10 Hz</span>
                </div>
              </div>
            </div>

            <div class="settings-card">
              <div class="settings-section-title">FAILSAFE PROTOCOLS</div>
              <div class="setting-row">
                <label for="set-rth">Low-Battery Auto RTH</label>
                <input id="set-rth" type="checkbox" checked />
              </div>
              <div class="setting-row">
                <label for="set-geofence">Max Ceil Alt (AGL)</label>
                <div class="setting-ctrl">
                  <input id="set-geofence" type="range" min="50" max="500" value="120" />
                  <span class="setting-val" id="val-geofence">120m</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
